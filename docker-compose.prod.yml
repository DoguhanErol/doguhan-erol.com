# 80 ve 443 bu dosyada yayınlanmaz. O portlar makinede zaten dinleniyor.
# app ve minio web-edge ağına compose ile girmez: servis adları "app" ve "minio"
# Qrivo Caddy'sinin DNS adlarıyla çakışır. scripts/publish-host.sh konteyner
# adıyla bağlar.
services:
  app:
    container_name: doguhan-portfolio-app
    ports: []
    environment:
      DEPLOY_ENV: production
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD:-portfolio}@db:5432/portfolio
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL}
      NEXT_PUBLIC_MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL}

  db:
    ports: []

  minio:
    container_name: doguhan-portfolio-minio

  # Yalnızca 80/443 boş olan bir makinede: --profile standalone
  # Paylaşılan VPS'te scripts/vps.sh bu profili açmaz.
  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - minio

volumes:
  caddy_data:
  caddy_config:
