# npm run local — yalnızca bu bilgisayar
services:
  app:
    ports:
      - "3010:3000"
    environment:
      DEPLOY_ENV: local
      NEXTAUTH_URL: http://localhost:3010
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3010
      NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:9010/portfolio

  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"

  minio:
    ports:
      - "9010:9000"
      - "9011:9001"
